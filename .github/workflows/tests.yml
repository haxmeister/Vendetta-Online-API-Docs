name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and Racecar crawler test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.4 libhtml-tree-perl liburi-perl
      - name: Run Perl tests
        run: prove -lr t
      - name: Run APIProbe strict-global mock (Lua 5.1)
        run: lua5.1 t/mock-plugin.lua
      - name: Run APIProbe strict-global mock (Lua 5.4)
        run: lua5.4 t/mock-plugin.lua
